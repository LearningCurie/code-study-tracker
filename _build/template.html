<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f2;--sf:#fff;--sf2:#f9faf8;--ink:#16202a;--mu:#5a6772;--ln:#dde2e6;--ac:#2556c4;--ok:#1b7a4b;--wa:#9a5b00;--no:#b42318;--hl:#fff4c2;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--sf:#17202a;--sf2:#131b23;--ink:#e7edf3;--mu:#97a6b4;--ln:#2a3540;--ac:#7db0ff;--ok:#52c88e;--wa:#f2b24b;--no:#ff8a80;--hl:#3a3315}}
:root[data-theme="dark"]{--bg:#0f151b;--sf:#17202a;--sf2:#131b23;--ink:#e7edf3;--mu:#97a6b4;--ln:#2a3540;--ac:#7db0ff;--ok:#52c88e;--wa:#f2b24b;--no:#ff8a80;--hl:#3a3315}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
p{margin:0}
ul{margin:0}
.top{max-width:1180px;margin:0 auto;padding:28px 20px 0}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mu);max-width:68ch}
.bar{height:8px;background:var(--ln);border-radius:4px;margin:18px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--mu);font-size:15px}
.stats b{color:var(--ink);font-weight:600}
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:22px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px 16px}
.box h2{font-size:16px;margin:0 0 8px}
.box ol,.box ul{padding-left:20px}
.box li{margin:4px 0}
.kit h3{font-size:14px;margin:12px 0 4px;color:var(--mu);font-weight:600}
.kit h3:first-of-type{margin-top:0}
.kit ul{padding-left:18px;font-size:15px}
.ctl{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);margin-top:22px}
.ctl .in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--sf)}
.seg button{font:inherit;font-size:14px;padding:6px 12px;border:0;border-left:1px solid var(--ln);background:transparent;color:var(--ink);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ctl select,.ctl input,.btn{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink)}
.ctl input{width:240px}
.btn{cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0f151b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0f151b}}
.sp{flex:1}
#jump{display:none}
.lay{max-width:1180px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
.rail ol{list-style:none;margin:0;padding:0}
.rail a{display:grid;grid-template-columns:26px 1fr auto;gap:0 6px;align-items:baseline;padding:5px 6px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
.rail a:hover{background:var(--sf)}
.rail .rn{color:var(--mu);text-align:right}
.rail .rc{color:var(--mu);font-size:12px}
.rail .rb{grid-column:2/4;height:3px;background:var(--ln);border-radius:2px;margin-top:4px;overflow:hidden}
.rail .rb b{display:block;height:100%;width:0;background:var(--ok)}
.rail li.dim a{opacity:.4}
.rail li.done .rn{color:var(--ok);font-weight:600}
.mod{background:var(--sf);border:1px solid var(--ln);border-radius:8px;margin:0 0 12px}
.mod>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:baseline;padding:12px 16px}
.mod>summary::-webkit-details-marker{display:none}
.mod .mn{color:var(--mu);font-size:15px}
.mod h2{font-size:18px;margin:0;line-height:1.3;font-weight:600}
.mod .mc{color:var(--mu);font-size:14px;white-space:nowrap}
.mod .mb{grid-column:2/4;height:4px;background:var(--ln);border-radius:2px;overflow:hidden;margin-top:6px}
.mod .mb b{display:block;height:100%;width:0;background:var(--ok)}
.mod .why{grid-column:2/4;color:var(--mu);font-size:15px;margin-top:4px}
.mod[open]>summary{border-bottom:1px solid var(--ln)}
.learn{padding:14px 16px;background:var(--sf2);border-bottom:1px solid var(--ln)}
.learn h3{font-size:15px;margin:0 0 6px;font-weight:600}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.lg ul{padding-left:18px;font-size:15px}
.lg li{margin:3px 0}
.lg .py{grid-column:1/-1;font-size:15px}
.lg .py p{color:var(--mu)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--ln)}
.res ul{padding-left:18px;font-size:15px}
.res li{margin:3px 0}
.apply{padding:6px 16px 14px}
.gh{font-size:15px;margin:14px 0 4px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.gh .n{color:var(--mu);font-weight:400;font-size:14px}
.gh .gd{color:var(--mu);font-weight:400;font-size:14px}
.items{list-style:none;padding:0;margin:0}
.it{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--ln)}
.it:first-child{border-top:0}
.it .pt{flex:1 1 300px;min-width:0}
.it .pn{text-decoration:none}
.it .pn:hover{text-decoration:underline}
.it .nb{color:var(--mu);margin-right:6px}
.it .lk{font-size:13px;margin-left:8px;white-space:nowrap}
.it .lk a{margin-right:9px;color:var(--mu)}
.it .lk a:hover{color:var(--ac)}
.it .d{color:var(--mu);font-size:14px;margin-top:2px}
.it.flash{animation:fl 1.6s ease-out}
@keyframes fl{from{background:var(--hl)}to{background:transparent}}
@media(prefers-reduced-motion:reduce){.it.flash{animation:none;background:var(--hl)}}
.bs{display:flex;gap:6px}
.b{font:inherit;font-size:13px;padding:3px 10px;border:1px solid var(--ln);border-radius:14px;background:transparent;color:var(--mu);cursor:pointer}
.b[aria-pressed="true"]{color:var(--bg)}
.b1[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.b2[aria-pressed="true"]{background:var(--wa);border-color:var(--wa)}
.b3[aria-pressed="true"]{background:var(--no);border-color:var(--no)}
.empty{color:var(--mu);padding:20px 0}
.foot{color:var(--mu);font-size:14px;margin-top:20px}
@media(max-width:900px){
 .intro{grid-template-columns:1fr}
 .lay{grid-template-columns:1fr}
 .rail{display:none}
 #jump{display:inline-block;max-width:100%}
 .lg,.res{grid-template-columns:1fr}
 .ctl{position:static}
 html{scroll-padding-top:8px}
 .it .lk{display:block;margin:2px 0 0}
 .ctl input{width:100%;order:9}
}
</style>
</head>
<body>
<header class="top">
<h1 id="ttl"></h1>
<p class="sub" id="sub"></p>
<div class="bar"><i id="fill"></i></div>
<div class="stats" id="stats"></div>
<div class="intro">
<section class="box"><h2 id="howh"></h2><ol id="how"></ol></section>
<section class="box kit" id="kit"></section>
</div>
</header>
<section class="top" aria-label="Progress storage">
<p><a href="./index.html">All study trackers</a></p>
<p id="local-status" role="status"></p>
<p id="cloud-status" role="status">Google Drive is optional. Sync manually on each device.</p>
<p>
<button type="button" class="btn" id="export-progress">Export progress</button>
<button type="button" class="btn" id="import-progress">Import progress</button>
<input type="file" id="progress-file" accept=".json,application/json" hidden>
<button type="button" class="btn" id="drive-connect">Connect Google Drive</button>
<button type="button" class="btn" id="drive-sync" disabled>Sync now</button>
<button type="button" class="btn" id="drive-disconnect" disabled>Disconnect</button>
</p>
<p class="foot">Progress stays in this browser unless you export it or connect Drive.
<a href="./setup.html">Hosting and Google Drive setup</a></p>
</section>
<div class="ctl"><div class="in">
<span class="seg" id="seg" role="group"></span>
<select id="flt" aria-label="Filter by status"></select>
<input id="q" type="search" aria-label="Search">
<select id="jump" aria-label="Jump to topic"></select>
<span class="sp"></span>
<button type="button" class="btn" id="tog">Expand all</button>
<button type="button" class="btn pri" id="next">Next unstarted</button>
</div></div>
<div class="lay">
<nav class="rail" aria-label="Study route"><ol id="rail"></ol></nav>
<main id="mods"></main>
</div>
<script src="./config.js"></script>
<script src="./progress.js"></script>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const A=(h,t,c)=>`<a${c?` class="${c}"`:""} href="${esc(h)}" target="_blank" rel="noopener">${esc(t)}</a>`;
const LAB=["",...DATA.statuses];
const M=new Map();
let fv="all";
document.title=DATA.title;
$("ttl").textContent=DATA.title;
$("sub").textContent=DATA.subtitle;
$("howh").textContent=DATA.howTitle;
$("q").placeholder=DATA.searchHint;
$("how").innerHTML=DATA.how.map(h=>`<li>${h}</li>`).join("");
$("kit").innerHTML=`<h2>${esc(DATA.kit.title)}</h2>`+DATA.kit.groups.map(g=>`<h3>${esc(g.h)}</h3><ul>${g.links.map(l=>`<li>${A(l.h,l.t)}</li>`).join("")}</ul>`).join("");
$("seg").setAttribute("aria-label",DATA.filter.label);
$("seg").innerHTML=["all",...DATA.filter.values].map(v=>`<button type="button" data-v="${esc(v)}" aria-pressed="${v==="all"}">${v==="all"?"All":esc(v)}</button>`).join("");
$("flt").innerHTML=`<option value="all">Any status</option><option value="0">Not started</option>`+DATA.statuses.map((s,i)=>`<option value="${i+1}">${esc(s)}</option>`).join("");
const row=it=>`<li class="it" data-id="${esc(it.id)}" data-f="${esc(it.f||"")}" data-s="${esc((it.n?it.n+" ":"")+it.t).toLowerCase()}"><div class="pt">${it.n?`<span class="nb">${esc(it.n)}</span>`:""}${A(it.h,it.t,"pn")}${it.links&&it.links.length?`<span class="lk">${it.links.map(l=>A(l.h,l.t)).join("")}</span>`:""}${it.d?`<p class="d">${esc(it.d)}</p>`:""}</div><span class="bs">${[1,2,3].map(c=>`<button type="button" class="b b${c}" data-c="${c}" aria-pressed="false">${esc(LAB[c])}</button>`).join("")}</span></li>`;
const sec=s=>`<div${s.wide?' class="py"':""}><h3>${esc(s.h)}</h3>${s.items?`<ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p>${esc(s.text)}</p>`}</div>`;
const resl=(h,ls)=>ls&&ls.length?`<div><h3>${esc(h)}</h3><ul>${ls.map(l=>`<li>${A(l.h,l.t)}</li>`).join("")}</ul></div>`:"";
$("mods").innerHTML=DATA.modules.map((m,i)=>`<details class="mod" id="m-${esc(m.key)}"><summary><span class="mn">${i+1}</span><h2>${esc(m.name)}</h2><span class="mc"></span>${m.why?`<p class="why">${esc(m.why)}</p>`:""}<span class="mb"><b></b></span></summary><div class="learn"><div class="lg">${m.learn.map(sec).join("")}</div><div class="res">${resl(DATA.readLabel,m.read)}${resl(DATA.watchLabel,m.watch)}</div></div><div class="apply">${m.groups.map(g=>`<section class="grp"><h3 class="gh">${esc(g.name)} <span class="n"></span>${g.note?`<span class="gd">${esc(g.note)}</span>`:""}</h3><ul class="items">${g.items.map(row).join("")}</ul></section>`).join("")}<p class="empty" hidden>Nothing here matches the current filters.</p></div></details>`).join("");
$("rail").innerHTML=DATA.modules.map((m,i)=>`<li><a href="#m-${esc(m.key)}" data-k="${esc(m.key)}"><span class="rn">${i+1}</span><span class="rt">${esc(m.name)}</span><span class="rc"></span><span class="rb"><b></b></span></a></li>`).join("");
$("jump").innerHTML=`<option value="">Jump to topic</option>`+DATA.modules.map((m,i)=>`<option value="${esc(m.key)}">${i+1}. ${esc(m.name)}</option>`).join("");
const items=[...document.querySelectorAll(".it")];
const total=items.length;
function paint(){
 const f=$("flt").value,q=$("q").value.trim().toLowerCase();
 items.forEach(li=>{const s=M.get(li.dataset.id)||0;li.querySelectorAll(".b").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.c===s));li.hidden=!((fv==="all"||li.dataset.f===fv)&&(f==="all"||+f===s)&&(!q||li.dataset.s.includes(q)))});
 const rl=[...document.querySelectorAll("#rail li")];
 document.querySelectorAll(".mod").forEach((d,i)=>{
  const li=[...d.querySelectorAll(".it")],vis=li.filter(x=>!x.hidden).length,done=li.filter(x=>M.get(x.dataset.id)===1).length,pct=li.length?done/li.length*100:0;
  d.querySelectorAll(".grp").forEach(g=>{const gl=[...g.querySelectorAll(".it")];g.hidden=gl.every(x=>x.hidden);g.querySelector(".n").textContent=gl.filter(x=>M.get(x.dataset.id)===1).length+"/"+gl.length});
  d.querySelector(".mc").textContent=done+"/"+li.length;d.querySelector(".mb b").style.width=pct+"%";
  d.querySelector(".empty").hidden=vis>0;
  const filtered=fv!=="all"||f!=="all"||q;d.hidden=!!filtered&&vis===0;
  if(q&&vis)d.open=true;
  const r=rl[i];r.querySelector(".rc").textContent=done+"/"+li.length;r.querySelector(".rb b").style.width=pct+"%";r.classList.toggle("dim",d.hidden);r.classList.toggle("done",li.length>0&&done===li.length);
 });
 const c=[0,0,0,0];items.forEach(li=>c[M.get(li.dataset.id)||0]++);
 $("fill").style.width=c[1]/total*100+"%";
 $("stats").innerHTML=`<span><b>${c[1]}</b> of ${total} ${esc(DATA.statuses[0].toLowerCase())}</span>`+DATA.filter.values.map(v=>{const l=items.filter(x=>x.dataset.f===v);return`<span>${esc(v)} <b>${l.filter(x=>M.get(x.dataset.id)===1).length}</b>/${l.length}</span>`}).join("")+(DATA.otherLabel?`<span>${esc(DATA.otherLabel)} <b>${items.filter(x=>!DATA.filter.values.includes(x.dataset.f)&&M.get(x.dataset.id)===1).length}</b>/${items.filter(x=>!DATA.filter.values.includes(x.dataset.f)).length}</span>`:"")+`<span>${esc(DATA.statuses[1])} <b>${c[2]}</b></span><span>${esc(DATA.statuses[2])} <b>${c[3]}</b></span>`;
}
$("mods").addEventListener("click",e=>{const b=e.target.closest(".b");if(!b)return;const id=b.closest(".it").dataset.id,c=+b.dataset.c;progress.set(id,M.get(id)===c?0:c)});
$("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;fv=b.dataset.v;$("seg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));paint()});
$("flt").addEventListener("change",paint);
$("q").addEventListener("input",paint);
function openMod(k){const d=$("m-"+k);if(d){d.open=true;d.scrollIntoView({block:"start"})}}
$("rail").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();openMod(a.dataset.k)});
$("jump").addEventListener("change",e=>{if(e.target.value)openMod(e.target.value);e.target.value=""});
$("tog").addEventListener("click",()=>{const ds=[...document.querySelectorAll(".mod")],open=!ds.every(d=>d.open);ds.forEach(d=>d.open=open);$("tog").textContent=open?"Collapse all":"Expand all"});
$("next").addEventListener("click",()=>{const it=items.find(li=>!M.has(li.dataset.id)&&(fv==="all"||li.dataset.f===fv));if(!it)return;const d=it.closest(".mod");d.open=true;if(it.hidden){$("flt").value="all";$("q").value="";paint()}it.scrollIntoView({block:"center"});it.classList.remove("flash");void it.offsetWidth;it.classList.add("flash");it.querySelector(".pn").focus({preventScroll:true})});
const progress=StudyProgress.mount({
 storageKey:DATA.storageKey,
 ids:items.map(li=>li.dataset.id),
 clientId:window.STUDY_CONFIG?.googleClientId||"",
 onChange(entries){M.clear();Object.entries(entries).forEach(([id,e])=>{if(e.status)M.set(id,e.status)});paint()}
});
{const first=items.find(li=>!M.has(li.dataset.id));(first?first.closest(".mod"):document.querySelector(".mod")).open=true}
</script>
</body>
</html>
